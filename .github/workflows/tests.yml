name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # coverage is a CI-only dev tool (the server stays stdlib-only); the report
      # lands in the job summary so untested handlers are visible on every run
      - run: pip install coverage==7.16.2
      - run: coverage run -m unittest discover
      # summary first (always written), then the check against fail_under
      - run: |
          { echo '```'; coverage report --sort=cover --fail-under=0; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          coverage report --skip-covered --sort=cover

  backend-types:
    name: Backend (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # ruff's ANN rules keep every backend function annotated; pyright checks
      # the annotations (both configured in pyproject.toml). Dev tools only —
      # the server itself stays stdlib-only.
      - run: pip install ruff==0.16.7 vulture==2.16
      - run: ruff check
      - run: ruff format --check
      # dead code (config in pyproject.toml [tool.vulture])
      - run: vulture
      - run: npm ci
      - run: npm run typecheck:py

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # strict TypeScript (tsconfig.json) and eslint over static/src + static/tests
      - run: npm run typecheck:ts
      - run: npm run lint
      - run: npm run format:check
      # the committed bundle must be what the sources build to
      - run: npm run build && git diff --exit-code static/dist/app.js
      # tests under coverage; vitest.config.js holds the thresholds (CI fails below)
      - run: npm run test:coverage
      # dead code: unused files/exports/dependencies (config in knip.json)
      - run: npm run deadcode
