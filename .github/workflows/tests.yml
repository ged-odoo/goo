name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # coverage is a CI-only dev tool (the server stays stdlib-only); the report
      # lands in the job summary so untested handlers are visible on every run
      - run: pip install coverage
      - run: coverage run -m unittest discover
      # summary first (always written), then the check against fail_under
      - run: |
          { echo '```'; coverage report --sort=cover --fail-under=0; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          coverage report --skip-covered --sort=cover

  backend-types:
    name: Backend (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # ruff's ANN rules keep every backend function annotated; pyright checks
      # the annotations (both configured in pyproject.toml). Dev tools only —
      # the server itself stays stdlib-only.
      - run: pip install ruff vulture
      - run: ruff check
      # dead code (config in pyproject.toml [tool.vulture])
      - run: vulture
      - run: npm ci
      - run: npm run typecheck:py

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test
      # dead code: unused files/exports/dependencies (config in knip.json)
      - run: npm run deadcode
