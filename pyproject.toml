[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["static", "backend/services/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN"]
ignore = [
    "E501",  # long SQL / command strings are clearer unwrapped
    "ANN401",  # Any is allowed: JSON bodies / config dicts are genuinely dynamic
]

[tool.ruff.lint.per-file-ignores]
# Odoo addon idioms: __init__.py re-export imports, __manifest__.py bare dict
"addons/**/__init__.py" = ["F401"]
"addons/**/__manifest__.py" = ["B018"]
# only the backend is required to be fully annotated (see [tool.pyright])
"addons/**" = ["ANN"]
"tests/**" = ["ANN"]

[tool.pyright]
# type-checks the backend (`npm run typecheck:py`, also run in CI); ruff's ANN rules
# above make sure every backend function stays annotated
include = ["backend", "goo.py"]
exclude = ["backend/services/templates"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.coverage.run]
# CI reports backend coverage (`coverage run -m unittest discover`); a dev tool only
source = ["backend"]
omit = ["backend/services/templates/*"]

[tool.vulture]
# dead-code check (`vulture`, run in CI); a dev tool only
paths = ["backend", "goo.py"]
# models.py fields are the wire contract (read by the frontend, not by Python)
exclude = ["backend/services/templates/", "backend/models.py"]
ignore_decorators = ["@post_route"]  # routes are registered by the decorator
# called by the stdlib (http.server / socketserver / urllib / signal), not by goo
ignore_names = [
    "do_GET", "do_POST", "log_message", "format", "https_response",
    "daemon_threads", "allow_reuse_address", "signum", "frame", "cls",
    "AUTORELOAD",  # kept for its side effect: the constructor starts the fetch thread
]
